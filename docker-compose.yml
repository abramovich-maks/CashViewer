services:
  postgres:
    image: postgres:16
    container_name: cashviewer-system-db
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secret
      POSTGRES_DB: cashviewer

volumes:
  postgres_data: