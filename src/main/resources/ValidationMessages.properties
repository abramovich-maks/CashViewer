    # Not empty
not.empty.validation.message=must not be empty
username.not.empty= username {not.empty.validation.message}
email.not.empty= email {not.empty.validation.message}
password.not.empty= password {not.empty.validation.message}

    # Not null
not.null.validation.message=must not be null
username.not.null= username {not.null.validation.message}
email.not.null= email {not.null.validation.message}
password.not.null= password {not.null.validation.message}

    # Email
not.formed.email= must be a well-formed
email.email=email {not.formed.email}

    # Size
size.validation.message=must be between {min} and {max} characters
password.size=password {size.validation.message}
