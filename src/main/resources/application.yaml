spring:
  application:
    name: CashViewer

  #PostgreSQL
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}

  ## Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  ## Token jwt
auth:
  jwt:
    issuer: Cash_Viewer
    expiration-minutes: 10