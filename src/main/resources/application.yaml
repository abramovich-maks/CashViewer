spring:
  application:
    name: CashViewer

  #PostgreSQL
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}

  ## Hibernate
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  ## Flyway
  flyway:
    enabled: true
    locations:
      - classpath:db.migration/general
      - classpath:db.migration/insert
    schemas: public

  ## Token jwt
auth:
  jwt:
    issuer: Cash_Viewer
    expiration-minutes: 10